<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (iOS-style) -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Subtle highlight for depth -->
  <rect width="512" height="512" rx="114" fill="url(#shine)"/>

  <!-- Top-view airplane, nose pointing upper-left -->
  <g transform="translate(256,256) rotate(-40) scale(0.78)">
    <!-- Fuselage: pointed nose at top, rounded tail at bottom -->
    <path d="M 0,-148 Q 24,-58 24,32 L 24,132 Q 24,156 0,162 Q -24,156 -24,132 L -24,32 Q -24,-58 0,-148 Z"
          fill="white"/>

    <!-- Right main wing: sweeps back from fuselage to tip -->
    <path d="M 24,-5 L 162,88 Q 170,100 160,110 Q 150,118 140,106 L 24,52 Z"
          fill="white"/>

    <!-- Left main wing -->
    <path d="M -24,-5 L -162,88 Q -170,100 -160,110 Q -150,118 -140,106 L -24,52 Z"
          fill="white"/>

    <!-- Right tail fin -->
    <path d="M 16,140 L 70,178 Q 77,187 70,194 Q 62,200 55,192 L 16,162 Z"
          fill="white"/>

    <!-- Left tail fin -->
    <path d="M -16,140 L -70,178 Q -77,187 -70,194 Q -62,200 -55,192 L -16,162 Z"
          fill="white"/>
  </g>
</svg>
