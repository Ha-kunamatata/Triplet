<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background (no rounded corners — masked by OS) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>

  <!-- Airplane scaled down to stay within the inner 80% safe zone -->
  <g transform="translate(256,256) rotate(-40) scale(0.60)">
    <path d="M 0,-148 Q 24,-58 24,32 L 24,132 Q 24,156 0,162 Q -24,156 -24,132 L -24,32 Q -24,-58 0,-148 Z"
          fill="white"/>
    <path d="M 24,-5 L 162,88 Q 170,100 160,110 Q 150,118 140,106 L 24,52 Z"
          fill="white"/>
    <path d="M -24,-5 L -162,88 Q -170,100 -160,110 Q -150,118 -140,106 L -24,52 Z"
          fill="white"/>
    <path d="M 16,140 L 70,178 Q 77,187 70,194 Q 62,200 55,192 L 16,162 Z"
          fill="white"/>
    <path d="M -16,140 L -70,178 Q -77,187 -70,194 Q -62,200 -55,192 L -16,162 Z"
          fill="white"/>
  </g>
</svg>
